[project]
name = "findery"
version = "0.1.0"
description = "Personal search monitor for classifieds platforms (OLX first) with Telegram alerts"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.scripts]
findery = "findery.__main__:main"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/findery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Cyrillic text in strings and comments is intentional in this project.
ignore = ["RUF001", "RUF002", "RUF003"]
